# Atlas Reactorum — .github/dependabot.yml

version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # Actions are pinned to full commit SHAs; Dependabot keeps the pins current
  # without loosening them to tags.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
