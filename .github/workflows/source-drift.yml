# Atlas Reactorum — .github/workflows/source-drift.yml

# Reports when a third-party publisher changed something the atlas reads.
# It is not part of the correctness gate, and a changed or unreadable source
# is a report, not a red build: the run ends green with a warning and a step
# summary, and the gate keeps the last validated set. Only a fully validated
# fresh set replaces the retained originals for the industrial round seven.
name: source-drift

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: source-drift
  cancel-in-progress: false

jobs:
  industrial-round-seven:
    name: Live publisher sources of the industrial round seven
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12.15"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install verified development graph
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes --no-deps -r requirements-dev.txt
      # Reading the retained set keeps it from expiring while a publisher's
      # change is being looked at; it is replaced only by a validated new set.
      - name: Read the retained publisher sources
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/industrial7-custody
          key: industrial7-custody-${{ github.run_id }}
          restore-keys: industrial7-custody-
      - name: Acquire and validate the live sources
        id: acquire
        run: |
          if ! make source-drift CUSTODY="$RUNNER_TEMP/industrial7-fresh" >"$RUNNER_TEMP/drift.txt" 2>&1; then
            {
              printf '## A publisher source changed or could not be read\n\n'
              printf 'The correctness gate keeps using the last validated set. Look at the source, not at the gate.\n\n'
              printf '```\n'
              tail -n 60 "$RUNNER_TEMP/drift.txt"
              printf '```\n'
            } >>"$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/drift.txt"
            echo "::warning title=Publisher source drift::A third-party source changed or could not be read; the retained validated set stays in use. See the step summary."
            echo "validated=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          cat "$RUNNER_TEMP/drift.txt"
          rm -rf "$RUNNER_TEMP/industrial7-custody"
          mv "$RUNNER_TEMP/industrial7-fresh" "$RUNNER_TEMP/industrial7-custody"
          echo "validated=true" >>"$GITHUB_OUTPUT"
      - name: Retain the validated sources for the gate
        if: steps.acquire.outputs.validated == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/industrial7-custody
          key: industrial7-custody-${{ github.run_id }}
