# Atlas Reactorum — .github/workflows/pre-commit.yml

name: pre-commit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pre-commit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hooks:
    name: Local hook parity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install verified development graph
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes --no-deps -r requirements-dev.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install immutable native JavaScript graph
        run: npm ci
      - name: Install pinned native shell tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes shellcheck=0.9.0-1 shfmt=3.8.0-1
      - run: make hooks
