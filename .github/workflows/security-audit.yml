# Atlas Reactorum — .github/workflows/security-audit.yml

name: security-audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 3 * * 3"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Security and licence audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install verified development graph
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes --no-deps -r requirements-dev.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.21.0"
      - run: npm audit --include=dev
      - run: .venv/bin/python -m bandit -r . -x ./.venv,./tests,./node_modules
      - run: .venv/bin/python tools/preflight.py --check secrets
      - run: .venv/bin/python -m pip_audit --require-hashes -r requirements-dev.txt
      - run: .venv/bin/reuse lint
      - run: .venv/bin/zizmor --offline .github/workflows
